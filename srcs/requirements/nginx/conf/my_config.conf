# set port + name + protocols that will server support + certificate + key + locations (staticly + php-fpm)

# by default will be 2 workers can handle a lot of reqs


server {

    listen 443 ssl;
    server_name hel-achh.42.fr;

    ssl_protocols TLSv1.2;
    ssl_certificate         /the_certificate/server.crtf;
    ssl_certificate_key     /the_key/server.key;


    root /wordpress;
    index readme.html index.html index.php;

    # what if user enter https://hel-achh.42.fr/about-us


    location ~ \.php$ {

        # so he will cant know how should handle this req
        include fastcgi_params;

        # will be can know where is folder so -> file not found
        fastcgi_param SCRIPT_FILENAME /wordpress/$fastcgi_script_name;

        # req will not send, and will give you just src code, cause can access to it
        # with no dest
        # nginx read the config before the browser req, keep it in momery 
        fastcgi_pass wordpress:9000;
    }
}

