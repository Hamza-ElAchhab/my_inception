
# this full conf file includes inside a http block.

#set port + name + protocols that will server support + certificate + key + locations (staticly + php-fpm)


server {

    listen 1234 ssl;
    server_name localhost;

    ssl_protocols TLSv1.2;
    ssl_certificate     /the_certificate/server.crtf;
    ssl_certificate_key /the_key/server.key;


    location / {

        root /wordpress;
        index index.php;
    }


# ~ start use RE
# . means any character
# \. means i want a real point only
# $ means we want this patter .php in the end of string

    location ~ \.php$ {

        root /wordpress;
        index index.php;


        #include confi file already exists, we load information from it will fpm need it
        include fastcgi_params;


        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass wordpress_cntr:9000;
    }
}

