server {

    listen 7888 ssl;
    server_name hi;

    ssl_protocols TLSv1.2;

    ssl_certificate             /the_certificate/server.crtf;
    ssl_certificate_key         /the_key/server.key;


    location / {
        root /wordpress;
        index index.php;
        try_files $uri $uri/ /index.php?$args;
    }
}
