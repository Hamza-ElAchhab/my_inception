
# this full conf file includes inside a http block.
# server name mandatoy if you have a lot of services using the ip and port

#set port + name + protocols that will server support + certificate + key + locations (staticly + php-fpm)

#if you put root and index out will be inherated in all locations


server {
    listen ssl 2356;
    host_name koko;

    ssl_protocols TLSv1.2;
    ssl_certificate             /the_certificate/server.crtf;
    ssl_certificate_key                     /the_key/server.key;

# handle https req
    location / {

        root /wordpress;
        index index.php;

# for run time storage data
#internal redirect
        try_files $uri $uri/ =404;
    }
}


