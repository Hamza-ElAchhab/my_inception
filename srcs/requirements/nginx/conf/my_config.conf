# set port + name + protocols that will server support + certificate + key + locations (staticly + php-fpm)


server {


    listen 443 ssl;
    # server_name my_server;

    ssl_protocols TLSv1.2;
    ssl_certificate         /the_certificate/server.crtf;
    ssl_certificate_key     /the_key/server.key;


    # means any req expm : 
    # GET /
    # GET /about
    # GET /index.php
    # use /wordpress as root
    # and readme.html index.html index.php as default
    # WE use location only if we have different folders of files
    # there are one server block level are will be inhereted in every location

    root /wordpress;
    index readme.html index.html index.php;


    # ~ for not use the exactly matchine, without ~ will find exactly to any text start with \.php$
    # \ without this will understand is . (point) mean any character can be here, so \ for make it exactly . (point)
    # $ means should all the pattern be in the end of text (without it can find the pattern in any place)
    location ~ \.php$ {

        # do not define root and index again

        include fastcgi_params;

        # this not with params cuase dont know where is /wordpress path
        fastcgi_param SCRIPT_FILENAME /wordpress/$fastcgi_script_name;
        fastcgi_pass wordpress:9000;
    }
}


