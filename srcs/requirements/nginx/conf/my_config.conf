#set port + name + protocols that will server support + certificate + key + locations (staticly + php-fpm)
# if use ssl flag and dont give the certf and keys will be error

server {
    
    listen 1234 ssl; # mandatory if u dont use the ssl flag will be only http req, even define all ssls_directives.
    server_name localhost; # server name mandatory if you have a lot of servers with same port and ip

    ssl_protocols TLSv1.2; #can work without this
    ssl_certificate         /the_certificate/server.crtf; # mand
    ssl_certificate_key     /the_key/server.key; # mand


    # if you dont use location will use the default.
    location / {
        root /wordpress;
        index index.html;
    }

    # k3raf fin yamshi bi motaba9at pattern
    location ~ \.php$ {

        # include fastcgi_params;

        # append params to fastcgi req
        # fastcgi_script_name -> the file that we need
        # this parameter not included in the path and it is mandatory for access to file
        # they are not include this parameter, cause of the base path will change in every filesys.
        fastcgi_param SCRIPT_FILENAME /wordpress/$fastcgi_script_name;


        fastcgi_pass wordpress_cntr:9000;
    }
}



