# This Docker Compose file defines and orchestrates the three services required
# The keys that i used :
# build - container_name , image , volumes(- s:d) , (networks: -) , environment(k: ${}) , depends_on: -, ports -, restart, driver_opts, type, o, device



services:


  mariadb:
    build: requirements/mariadb
    image: mariadb
    volumes:
      - mariadb_vol:/var/lib/mysql
    networks:
      - project_network
    container_name: mariadb_cntr
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER_NAME: ${DATABASE_USER_NAME}
      DATABASE_USER_PASSWORD: ${DATABASE_USER_PASSWORD}
    restart: on-failure



  wordpress:
    build: requirements/wordpress
    image: wordpress
    volumes:
      - wordpress_vol:/wordpress
    networks:
      - project_network
    container_name: wordpress_cntr
    depends_on:
      - mariadb
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER_NAME: ${DATABASE_USER_NAME}
      DATABASE_USER_PASSWORD: ${DATABASE_USER_PASSWORD}
      DOMAIN_NAME: ${URL}
      WORDPRESS_ADMIN_NAME: ${WORDPRESS_ADMIN_NAME}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WORDPRESS_USER: ${WORDPRESS_USER}
      WORDPRESS_USER_PASS: ${WORDPRESS_USER_PASS}
    restart: on-failure



  nginx:
    build: requirements/nginx
    image: nginx
    volumes:
      - wordpress_vol:/wordpress
    networks:
      - project_network
    ports:
      - 443:443
    container_name: nginx_cntr
    restart: on-failure



volumes:

  mariadb_vol:
    driver_opts:
      type: none # no need fs type in bind m
      o: bind
      device: /home/hel-achh/data/mariadb

  wordpress_vol:
    driver_opts:
      type: none
      o: bind
      device: /home/hel-achh/data/wordpress



networks:
  project_network:


# type=none: ما كيقولش إن الـ filesystem الحقيقي نوعه none.
# o=bind: كيطلب ربط المسار الموجود بمسار آخر.



# https://hel-achh.42.fr/wp-admin/    default. admin

# restart: always restart in exit0 or exit1
# if proccess exited for some probleme in memory restart it


# mount --type=none --bind /source /destination
# mount --bind /source /destination
# the same, we are in the same fs type in --bind
# o: bind, docker dont do a namevolume

