
# the keys that i used :
# build - container_name - image - volumes(s, d) - networks - environment(k: ${}) - depends_on - ports

services:

  mariadb:
    build: requirements/mariadb
    image: mariadb
    volumes:
      - mariadb_vol:/var/lib/mysql
    networks:
      - project_network
    container_name: mariadb_cntr
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER_NAME: ${DATABASE_USER_NAME}
      DATABASE_USER_PASSWORD: ${DATABASE_USER_PASSWORD}
    restart: always



  wordpress:
    build: requirements/wordpress
    image: wordpress
    volumes:
      - wordpress_vol:/wordpress
    networks:
      - project_network
    container_name: wordpress_cntr
    depends_on:
      - mariadb
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER_NAME: ${DATABASE_USER_NAME}
      DATABASE_USER_PASSWORD: ${DATABASE_USER_PASSWORD}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WORDPRESS_ADMIN_NAME: ${WORDPRESS_ADMIN_NAME}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WORDPRESS_USER: ${WORDPRESS_USER}
      WORDPRESS_USER_PASS: ${WORDPRESS_USER_PASS}
    restart: always



  nginx:
    build: requirements/nginx
    image: nginx
    volumes:
    # talab rabt al masar
      - wordpress_vol:/wordpress
    networks:
      - project_network
    ports:
      - "443:443"
    container_name: nginx_cntr
    restart: always



volumes:

  mariadb_vol:
    driver_opts:
      type: none # no need fs type in bind m
      o: bind
      device: /home/hel-achh/data/mariadb

  wordpress_vol:
    driver_opts:
      type: none
      o: bind
      device: /home/hel-achh/data/wordpress



networks:
  project_network:


# type=none: ما كيقولش إن الـ filesystem الحقيقي نوعه none.
# o=bind: كيطلب ربط المسار الموجود بمسار آخر.


